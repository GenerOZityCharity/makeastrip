<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to the fundraiser…</title>

  <!-- Tell search engines the real page lives at the destination -->
  <link rel="canonical" href="https://loves.charity/fundraisers/makeastrippaxaus2026">
  <meta name="robots" content="noindex">

  <!-- Works even with JavaScript disabled -->
  <meta http-equiv="refresh" content="0; url=https://loves.charity/fundraisers/makeastrippaxaus2026">

  <!-- Faster than meta refresh; replace() keeps this page out of the back-button history -->
  <script>
    window.location.replace("https://loves.charity/fundraisers/makeastrippaxaus2026");
  </script>

  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    a { color: inherit; }
  </style>
</head>
<body>
  <p>
    Taking you to the fundraiser.<br>
    If nothing happens, <a href="https://loves.charity/fundraisers/makeastrippaxaus2026">open it here</a>.
  </p>
</body>
</html>
